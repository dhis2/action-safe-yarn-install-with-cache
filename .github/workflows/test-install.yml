name: Test safe install with cache

on:
  pull_request:
  workflow_dispatch:

jobs:
  dummy-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: ''
      - name: Create package.json and yarn.lock
        run: |
          echo '{"name":"dummy-package","version":"1.0.0","dependencies":{"is-number":"7.0.0"}}' > package.json
          cat > yarn.lock <<'EOF'
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          # yarn lockfile v1


          is-number@7.0.0:
            version "7.0.0"
            resolved "https://registry.yarnpkg.com/is-number/-/is-number-7.0.0.tgz#7535345b896734d5f80c4d06c50955527a14f12b"
            integrity sha512-41Cifkg6e8TylSpdtTpeLVMqvSBEVzTttHvERD741+pnZ8ANv0004MRL43QKPDlK9cGvNp6NZWZUBlbGXYxxng==
          EOF
      - uses: ./
      - name: Check package was installed
        run: test -f node_modules/is-number/package.json

  dummy-install-with-args:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: ''
      - name: Create package.json without yarn.lock
        run: |
          echo '{"name":"dummy-package","version":"1.0.0","dependencies":{"is-number":"7.0.0"}}' > package.json
      # The default --frozen-lockfile would fail here because yarn.lock is missing
      - uses: ./
        with:
          install-args: --non-interactive --ignore-scripts
      - name: Check yarn.lock was generated
        run: grep -q '^is-number@7.0.0:' yarn.lock
